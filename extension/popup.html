<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>ΚΗΜΔΗΣ Υπερ-Εργαλείο</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    width: 330px; margin: 0; padding: 16px;
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px;
    background: #f6f8fb; color: #16212e;
  }
  @media (prefers-color-scheme: dark) { body { background: #17212c; color: #e6edf5; } }

  h1 { font-size: 15px; margin: 0 0 2px; color: #0b5ea8; }
  @media (prefers-color-scheme: dark) { h1 { color: #4aa3e8; } }
  .sub { font-size: 11.5px; opacity: .7; margin-bottom: 13px; line-height: 1.4; }

  label { display: block; font-size: 11.5px; font-weight: 700; opacity: .75; margin-bottom: 4px; }
  input {
    width: 100%; padding: 10px 11px; font-size: 14px; font-family: Consolas, monospace;
    border: 1px solid #bac7d4; border-radius: 8px; text-transform: uppercase;
    background: #fff; color: inherit; letter-spacing: .4px;
  }
  @media (prefers-color-scheme: dark) { input { background: #0f1720; border-color: #3b4d63; } }
  input:focus { outline: 0; border-color: #0b5ea8; box-shadow: 0 0 0 3px rgba(11,94,168,.18); }

  button {
    width: 100%; padding: 11px; margin-top: 8px; font-size: 13.5px; font-weight: 700;
    font-family: inherit; border: 0; border-radius: 8px; cursor: pointer;
    background: #0b5ea8; color: #fff; transition: filter .15s;
  }
  button:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; color: inherit; border: 1px solid #bac7d4; }
  @media (prefers-color-scheme: dark) { button.ghost { border-color: #3b4d63; } }
  button:disabled { opacity: .55; cursor: default; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row button { margin-top: 0; }
  hr { border: 0; border-top: 1px solid rgba(127,127,127,.25); margin: 14px 0 10px; }
  .msg { font-size: 11.5px; margin-top: 10px; min-height: 15px; line-height: 1.4; }
  .msg.err { color: #b42318; font-weight: 700; }
  @media (prefers-color-scheme: dark) { .msg.err { color: #f87171; } }
  .foot { font-size: 10.5px; opacity: .6; margin-top: 12px; text-align: center; line-height: 1.5; }
</style>
</head>
<body>

<h1>ΚΗΜΔΗΣ Υπερ-Εργαλείο</h1>
<div class="sub">Πλήρης αλυσίδα από ΑΔΑΜ, ΑΔΑ Διαύγειας ή Α/Α ΕΣΗΔΗΣ</div>

<label for="adam">Αναγνωριστικό (προαιρετικό)</label>
<input id="adam" placeholder="π.χ. 26SYMV019210768" autocomplete="off" autofocus>

<button id="open">🔗 Άνοιγμα εργαλείου</button>

<hr>

<div class="row">
  <button class="ghost" id="overlay" title="Εμφάνιση πάνω στη σελίδα του ΚΗΜΔΗΣ">📄 Στη σελίδα</button>
  <button class="ghost" id="site" title="Άνοιγμα του ΚΗΜΔΗΣ">🏛️ ΚΗΜΔΗΣ</button>
</div>

<div class="msg" id="msg"></div>

<div class="foot">developer V. Diakolios<br>Δήμος Ρόδου — Δ/νση Τεχνικών Έργων &amp; Υποδομών</div>

<script src="popup.js"></script>
</body>
</html>
