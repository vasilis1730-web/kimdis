<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ΚΗΜΔΗΣ — Υπερ-Εργαλείο Αναζήτησης</title>

<meta name="description" content="Αναζήτηση πλήρους αλυσίδας δημοσίων συμβάσεων στο ΚΗΜΔΗΣ από ΑΔΑΜ, ΑΔΑ Διαύγειας ή Α/Α ΕΣΗΔΗΣ, με οικονομική ανάλυση και εξαγωγή σε Excel, CSV, JSON και ZIP.">
<meta name="author" content="developer V. Diakolios">
<meta name="theme-color" content="#0b5ea8">
<meta name="color-scheme" content="light dark">

<meta property="og:title" content="ΚΗΜΔΗΣ — Υπερ-Εργαλείο Αναζήτησης">
<meta property="og:description" content="Πλήρης αλυσίδα δημόσιας σύμβασης από έναν μόνο κωδικό.">
<meta property="og:type" content="website">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="assets/khmdis-ui.css">

<style>
  /* Ελάχιστα στυλ για τη σελίδα-υποδοχέα — όλα τα υπόλοιπα ζουν στο khmdis-ui.css */
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body { background: #eef2f7; }
  @media (prefers-color-scheme: dark) { body { background: #0f1720; } }

  #boot {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; gap: 14px; font-family: "Segoe UI", system-ui, sans-serif; color: #5b6b7d;
    text-align: center; padding: 24px;
  }
  #boot .ring {
    width: 34px; height: 34px; border: 3px solid #c3d0de; border-top-color: #0b5ea8;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #boot .fail { color: #b42318; font-weight: 700; max-width: 520px; line-height: 1.6; }
  #boot code { background: rgba(127,127,127,.15); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { #boot .ring { animation: none; } }
</style>
</head>
<body>

<noscript>
  <div style="padding:28px;font-family:system-ui,sans-serif;text-align:center">
    <h1>Χρειάζεται JavaScript</h1>
    <p>Η εφαρμογή ανακτά δεδομένα από το ΚΗΜΔΗΣ ζωντανά και δεν μπορεί να λειτουργήσει χωρίς JavaScript.</p>
  </div>
</noscript>

<div id="app">
  <div id="boot">
    <div class="ring"></div>
    <div>Φόρτωση εφαρμογής…</div>
  </div>
</div>

<script src="assets/vendor/jszip.min.js"></script>
<script src="assets/khmdis-core.js"></script>
<script src="assets/khmdis-ui.js"></script>
<script>
(function () {
  'use strict';

  var boot = document.getElementById('boot');

  function fail(message) {
    boot.innerHTML = '<div class="fail">⚠️ ' + message + '</div>';
  }

  if (!window.KHMDIS || !window.KHMDIS_UI) {
    fail('Δεν φορτώθηκαν τα αρχεία της εφαρμογής.<br><br>' +
         'Αν τρέχεις τη σελίδα τοπικά με διπλό κλικ, ο browser μπλοκάρει τη φόρτωση. ' +
         'Χρησιμοποίησε έναν τοπικό server, π.χ. <code>python3 -m http.server</code>, ' +
         'και άνοιξε <code>http://localhost:8000</code>.');
    return;
  }

  try {
    boot.remove();
    window.KHMDIS_UI.mount({ container: document.getElementById('app'), overlay: false });
  } catch (e) {
    fail('Σφάλμα εκκίνησης: ' + (e && e.message ? e.message : e));
    return;
  }

  /* --- Service worker: λειτουργία εκτός σύνδεσης για το κέλυφος ---------- */
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        // Όταν έρθει νέα έκδοση, ενημερώνουμε διακριτικά αντί να σπάσουμε τη σελίδα
        reg.addEventListener('updatefound', function () {
          var sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', function () {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              console.info('[ΚΗΜΔΗΣ] Διαθέσιμη νέα έκδοση — ανανέωσε τη σελίδα.');
            }
          });
        });
      }).catch(function (e) {
        console.warn('[ΚΗΜΔΗΣ] Ο service worker δεν καταχωρήθηκε:', e && e.message);
      });
    });
  }
})();
</script>

</body>
</html>
